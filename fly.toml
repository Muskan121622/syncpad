# SyncPad realtime backend on Fly.io.
# One port (8080) carries BOTH the CRDT websocket and the rewind/streak REST
# API (SINGLE_PORT=1) — PaaS gives you exactly one exposed port, so the server
# was designed around that constraint instead of proxying two services.

app = "syncpad-ws"
primary_region = "bom" # Mumbai — lowest RTT for the people actually using it

[build]
dockerfile = "apps/server/Dockerfile"

[env]
PORT = "8080"
SINGLE_PORT = "1"
DATA_DIR = "/data"

# Pad snapshots + edit log MUST survive restarts/deploys. Without a volume the
# app still syncs live, but every cold start forgets the rooms it was holding.
[mounts]
source = "syncpad_data"
destination = "/data"

[[services]]
internal_port = 8080
protocol = "tcp"

[services.concurrency]
type = "connections" # websockets are long-lived: count connections, not requests
hard_limit = 250
soft_limit = 200

[[services.tcp_checks]]
interval = "15s"
timeout = "2s"
grace_period = "10s"

[[services.http_checks]]
interval = "30s"
timeout = "3s"
method = "get"
path = "/health"

[[services.ports]]
port = 80
handlers = ["http"]
force_https = true

[[services.ports]]
port = 443
handlers = ["tls", "http"]

[[vm]]
size = "shared-cpu-1x"
memory = "256mb"
