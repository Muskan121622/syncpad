# ─────────────────────────────────────────────────────────────────────────────
#  SyncPad TURN relay — coturn config for an Oracle Free Tier VM
#  Copy to the VM at /etc/turnserver.conf, fill the 4 placeholders marked ⬅️,
#  then `sudo systemctl restart coturn`. Full setup: infra/turn/README.md
#
#  Why this exists: STUN only finds a DIRECT path. Two friends in different
#  cities (or on mobile data, or behind AP-isolating routers) sit behind NATs
#  that block direct media — with no TURN the WebRTC call "connects" in
#  signaling but zero audio/video flows (the dark-tile bug we diagnosed).
# ─────────────────────────────────────────────────────────────────────────────

listening-port=3478
tls-listening-port=5349

# Oracle assigns a RESERVED PUBLIC ip that is 1:1 NAT'd to the PRIVATE ip on
# the VNIC. coturn MUST know the mapping or relayed packets go out with the
# private address and never come back. This single line is the #1 reason
# "coturn installed but still no media" happens on cloud VMs.
#   format: external-ip=<PUBLIC_IP>/<PRIVATE_IP>
external-ip=YOUR_PUBLIC_IP/YOUR_PRIVATE_IP        # ⬅️ fill both

listening-ip=YOUR_PRIVATE_IP                        # ⬅️ same private ip
relay-ip=YOUR_PRIVATE_IP                            # ⬅️ same private ip

# UDP relay port range the peers actually send media through. Open this exact
# range in BOTH the Oracle Security List AND the OS firewall (see README).
min-port=49160
max-port=49200

# Long-term credential auth (RFC 5389) with one static user — simplest to wire
# into the browser. The username/credential here MUST match VITE_TURN_USER /
# VITE_TURN_PASS you set on Vercel. CHANGE the password; do not ship this one.
lt-cred-mech
user=syncpad:CHANGE_ME_STRONG_PASSWORD              # ⬅️ pick a real secret
realm=YOUR_PUBLIC_IP                                # ⬅️ any stable label

# Hardening / sane defaults for a small study-room relay.
fingerprint             # add STUN fingerprint attribute
no-multicast-peers
no-loopback-peers
no-cli
pidfile=/run/turnserver.pid

# Keep logs chatty while you bring it up (drop to a file / quiet later).
verbose
# log-file=/var/log/turnserver.log
